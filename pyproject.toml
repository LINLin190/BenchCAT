[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ethercat-workbench"
version = "1.1.0"
description = "EtherCAT Workbench - Windows pySOEM EtherCAT slave debugging application"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE.md"}
dependencies = [
  "pysoem==1.1.13",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.21,<7", "pytest>=8", "ruff>=0.6"]

[project.scripts]
ethercat-workbench-bridge = "ethercat_debug_tool.bridge:main"

[project.urls]
Repository = "https://github.com/LINLin190/EtherCAT-Workbench"
Issues = "https://github.com/LINLin190/EtherCAT-Workbench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ethercat_debug_tool = ["esc_profiles/data/*.json", "protocol/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
